; PlatformIO Project Configuration File
;
; Build options: framework = stm32cube (HAL/CMSIS from PlatformIO's
;   framework-stm32cubef1 package), user code from CubeMX's Core/Src.
;   CubeMX-generated files that would collide with the framework's bundled
;   CMSIS system file and newlib-nosys stubs are excluded below.
; Upload options: ST-Link (clone OK) via OpenOCD.
; Debug options: ST-Link (clone OK) via OpenOCD + GDB, SWD on PA13/PA14.

[platformio]
; CubeMX-generated user code
src_dir = Core/Src

[env:stm32f103c8t6]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

build_src_filter =
    +<*.c>
    -<system_stm32f1xx.c>
    -<syscalls.c>
    -<sysmem.c>

; CubeMX-generated headers (main.h, spi.h, usb.h, stm32f1xx_hal_conf.h)
build_flags =
    -ICore/Inc

; Flash via ST-Link (clone) using OpenOCD
upload_protocol = stlink

; Debug via ST-Link (clone) using OpenOCD
debug_tool = stlink
debug_server = openocd